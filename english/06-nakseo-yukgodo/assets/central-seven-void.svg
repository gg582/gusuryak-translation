<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 275" width="760" height="550" role="img" aria-labelledby="title desc">
  <title id="title">圓束樣式: seven-cell figure with a vacant center</title>
  <desc id="desc">One black central hexagon and six surrounding cells aligned as a regular hexagonal lattice; each opposing pair has the same color.</desc>
  <rect width="380" height="275" fill="#fffdf7"/>
  <g stroke="#4a4032" stroke-width="2.5" stroke-linejoin="round">
    <!-- Pointy-top regular hexagons, radius 40; neighboring centers are sqrt(3)*40 apart. -->
    <polygon points="155.36,25 190,45 190,85 155.36,105 120.72,85 120.72,45" fill="#e4eff5"/>
    <polygon points="224.64,145 259.28,165 259.28,205 224.64,225 190,205 190,165" fill="#e4eff5"/>
    <polygon points="224.64,25 259.28,45 259.28,85 224.64,105 190,85 190,45" fill="#f7e2cf"/>
    <polygon points="155.36,145 190,165 190,205 155.36,225 120.72,205 120.72,165" fill="#f7e2cf"/>
    <polygon points="259.28,85 293.92,105 293.92,145 259.28,165 224.64,145 224.64,105" fill="#e5efd8"/>
    <polygon points="120.72,85 155.36,105 155.36,145 120.72,165 86.08,145 86.08,105" fill="#e5efd8"/>
    <polygon points="190,85 224.64,105 224.64,145 190,165 155.36,145 155.36,105" fill="#252525"/>
  </g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#221d17">
    <text x="155.36" y="69">A</text><text x="224.64" y="189">A′</text>
    <text x="224.64" y="69">B</text><text x="155.36" y="189">B′</text>
    <text x="259.28" y="129">C</text><text x="120.72" y="129">C′</text>
  </g>
  <text x="190" y="130" font-family="sans-serif" font-size="14" text-anchor="middle" fill="white">void</text>
  <text x="190" y="260" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#493d2e">圓束樣式: vacant center + three antipodal pairs</text>
</svg>
